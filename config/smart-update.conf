# shellcheck shell=bash disable=SC2034

# Smart Update — Configuration générale

# Mode de fonctionnement :
# audit   = vérification seulement
# guarded = installation automatique uniquement si aucun risque détecté
MODE="audit"

# Dépôts officiels uniquement.
ALLOW_AUR="no"

# Politique des mises à jour de paquets critiques :
# yes = comportement normal : une mise à jour critique STABLE produit
#       WARNING mais reste installable en mode guarded
# no  = mode administrateur ultra-conservateur : toute mise à jour critique
#       produit BLOCK
ALLOW_CRITICAL_UPDATES="yes"

# Refuser toute suppression de paquet.
ALLOW_REMOVALS="no"

# Refuser les nouvelles dépendances installées automatiquement.
ALLOW_NEW_DEPENDENCIES="no"

# Bloquer les remplacements de paquets.
ALLOW_REPLACEMENTS="no"

# Ne jamais utiliser --overwrite.
ALLOW_OVERWRITE="no"

# Nombre maximal de mises à jour par transaction.
MAX_UPDATE_COUNT=500

# Espace minimal disponible sur / en Mio.
MIN_ROOT_FREE_MIB=4096

# Vérification des annonces Arch.
CHECK_ARCH_NEWS="yes"

# Nombre d’annonces récentes à examiner.
ARCH_NEWS_LIMIT=10

# Ne jamais redémarrer automatiquement.
AUTO_REBOOT="no"

# Ne jamais créer automatiquement de snapshot.
AUTO_SNAPSHOT="no"

# Conserver les rapports pendant ce nombre de jours.
REPORT_RETENTION_DAYS=90

# Journal principal.
LOG_FILE="/var/log/smart-update/smart-update.log"

# Journal des opérations bloquées.
BLOCKED_LOG="/var/log/smart-update/blocked.log"

# Répertoire des rapports.
REPORT_DIR="/var/log/smart-update/reports"
