<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Smart Update decision model</title>
  <desc id="desc">Illustrative transaction analysis flowing to ALLOW, WARNING or BLOCK decisions.</desc>
  <rect width="1200" height="420" rx="24" fill="#0f172a"/>

  <text x="60" y="62" fill="#f8fafc" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="30" font-weight="700">Decision model</text>
  <text x="60" y="94" fill="#94a3b8" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="16">Illustrative flow — Smart Update evaluates policy before installation.</text>

  <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
    <rect x="60" y="145" width="230" height="112" rx="18" fill="#172033" stroke="#334155" stroke-width="2"/>
    <text x="88" y="180" fill="#e2e8f0" font-size="18" font-weight="700">Planned transaction</text>
    <text x="88" y="210" fill="#94a3b8" font-size="15">packages · versions</text>
    <text x="88" y="234" fill="#94a3b8" font-size="15">removals · replacements</text>

    <path d="M300 201h92" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="m382 190 18 11-18 11" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="405" y="130" width="305" height="142" rx="18" fill="#172033" stroke="#38bdf8" stroke-width="2"/>
    <text x="438" y="169" fill="#e2e8f0" font-size="19" font-weight="700">Policy engine</text>
    <text x="438" y="201" fill="#94a3b8" font-size="15">stability · critical packages</text>
    <text x="438" y="226" fill="#94a3b8" font-size="15">dependencies · Arch News</text>
    <text x="438" y="251" fill="#94a3b8" font-size="15">transaction drift · capability gate</text>

    <path d="M720 201h92" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="m802 190 18 11-18 11" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="830" y="124" width="145" height="64" rx="16" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="870" y="164" fill="#bbf7d0" font-size="19" font-weight="700">ALLOW</text>

    <rect x="830" y="200" width="145" height="64" rx="16" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
    <text x="850" y="240" fill="#fde68a" font-size="19" font-weight="700">WARNING</text>

    <rect x="830" y="276" width="145" height="64" rx="16" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <text x="871" y="316" fill="#fecaca" font-size="19" font-weight="700">BLOCK</text>

    <text x="1005" y="159" fill="#94a3b8" font-size="14">approved</text>
    <text x="1005" y="235" fill="#94a3b8" font-size="14">review advised</text>
    <text x="1005" y="311" fill="#94a3b8" font-size="14">installation denied</text>
  </g>

  <text x="60" y="375" fill="#64748b" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="14">Pacman remains the package-management authority. Smart Update protects the decision and execution workflow.</text>
</svg>
